- name: create ec2 instance 
  hosts: local
  connection: local
  vars:
    instances: ["mongodb", "redis", "mysql", "rabbitmq"]
    action: create
    domain_name: viewsdial.com
    ami_id: ami-0055977a6e828a4f4
  tasks:
  - name: create ec2 instance
    amazon.aws.ec2_instance:
      name: "roboshop-{{ item }}"
      image_id: "{{ ami_id}}"
      instance_type: t3.micro
      security_groups:
      - roboshop-common
      - "roboshop-{{ item }}"
      region: us-east-1
    loop: "{{ instance }}"
    when: action == "create"